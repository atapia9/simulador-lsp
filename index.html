<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador LSP · Construye, cuenta y reflexiona</title>
    <meta
      name="description"
      content="Simulador 3D de construcción con ladrillos para talleres inspirados en la metodología LEGO® SERIOUS PLAY®. Proyecto independiente, funciona en tu navegador."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica el tema antes de pintar para evitar un destello.
      (function () {
        var t = null;
        try {
          t = JSON.parse(localStorage.getItem('simulador-lsp:tema'));
        } catch (e) {}
        if (t !== 'claro' && t !== 'oscuro') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        }
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <p style="padding: 24px; font-family: system-ui, sans-serif">Cargando el simulador…</p>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Este simulador necesita JavaScript. Actívalo en tu navegador para usarlo.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
